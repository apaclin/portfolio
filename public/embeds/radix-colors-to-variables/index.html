<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Radix Colors to Variables</title>
    <style>

      :root {
        color-scheme: light;
        --bg: #bdbdbd;
        --surface: #ffffff;
        --text: #211f26;
        --muted: #0400119c;
        --placeholder: #0500197d;
        --border: #211f26;
        --shadow: #1a1a1a;
        --chip: #ffd560;
        --button: #ff85d2;
        --error: #ff4757;
        --field-active: #e2a016;
        --field-readonly: #f2eff3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: auto !important;
        overflow: hidden;
      }

      body {
        width: 564px;
        background: var(--bg);
        color: var(--text);
        font-family: "Space Grotesk", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .shell {
        position: relative;
        height: auto;
        overflow: visible;
        padding: 24px 28px 28px 24px;
        background: var(--surface);
        border-radius: 0;
        display: flex;
        flex-direction: column;
      }

      .shell.has-status {
        padding-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 29px;
        letter-spacing: -0.3px;
      }

      .intro {
        margin: 4px 0 16px;
        color: var(--text);
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 2px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 4px 4px 0 var(--shadow);
        margin-bottom: 28px;
      }

      .tab {
        border: 0;
        border-right: 2px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
        font-weight: 500;
        letter-spacing: -0.1px;
        cursor: pointer;
        padding: 7px 0;
      }

      .tab:last-child {
        border-right: 0;
      }

      .tab.active {
        background: var(--chip);
      }

      .panel {
        display: none;
      }

      .panel.active {
        display: block;
      }

      #panel-library.active {
        /* padding-bottom: 18px; */
      }

      .stack {
        display: flex;
        flex-direction: column;
      }

      .modes-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: 0;
        margin-bottom: 12px;
      }

      .toolbar-actions {
        display: flex;
        gap: 12px;
        align-items: flex-end;
      }

      .text-button {
        padding: 0;
        border: none;
        background: none;
        box-shadow: none;
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.1px;
        cursor: pointer;
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
      }

      .mode-chips {
        display: flex;
        gap: 12px;
        margin-bottom: 6px;
      }

      .mode-chip {
        padding: 7px 14px;
        border: 2px solid var(--border);
        border-radius: 99px;
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.1px;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--shadow);
      }

      .mode-chip.active {
        background: var(--chip);
      }

      /* Outer container: border, shadow, anchor for overlay buttons */
      .scale-panel {
        position: relative;
        border: 2px solid var(--border);
        border-radius: 8px;
        box-shadow: 4px 4px 0 var(--shadow);
        /* margin-bottom: 16px; */
        width: 512px;
        height: 302px;
      }

      /* Inner scroll area: content does not scroll the buttons */
      .scale-content {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px 6px 10px 14px;
        border-radius: 6px;
        scrollbar-gutter: stable;
      }

      .scale-content::-webkit-scrollbar {
        width: 12px;
      }

      .scale-content::-webkit-scrollbar-track {
        background: transparent;
        margin: 0;
      }

      .scale-content::-webkit-scrollbar-thumb {
        background: #d1d1d1;
        border-radius: 999px;
        border: 4px solid transparent;
        background-clip: padding-box;
      }

      .scale-group-title {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
      }

      .scale-divider {
        width: 100%;
        height: 24px;
        margin: 0;
        background: none;
      }

      .scale-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 12px;
        row-gap: 12px;
      }

      .scale-option {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
        cursor: pointer;
      }

      .scale-name {
        display: inline-block;
        transform: translateY(1px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .field-label {
        display: block;
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
      }

      .text-input,
      .textarea {
        width: 512px;
        border: 2px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
        box-shadow: 4px 4px 0 var(--shadow);
        transition: border-color 0.1s, box-shadow 0.1s;
      }

      .text-input {
        height: 40px;
        padding: 9px 14px;
        margin-bottom: 20px;
      }

      .text-input:focus,
      .textarea:focus {
        outline: none;
        border-color: var(--field-active);
        box-shadow: 4px 4px 0 var(--field-active);
      }

      .text-input:read-only {
        background: var(--field-readonly);
      }

      .textarea {
        height: 273px;
        padding: 10px 4px 10px 14px;
        resize: none;
        margin-bottom: 0;
        display: block;
        scrollbar-gutter: stable;
      }

      .textarea::placeholder {
        color: var(--placeholder);
      }

      .textarea.error {
        border-color: var(--error);
        box-shadow: 4px 4px 0 var(--error);
      }

      .textarea.shake {
        animation: shake 0.16s linear 4;
      }

      #css-input::-webkit-scrollbar {
        width: 12px;
      }

      #css-input::-webkit-scrollbar-track {
        background: transparent;
        margin: 0;
      }

      #css-input::-webkit-scrollbar-thumb {
        background: #d1d1d1;
        border-radius: 999px;
        border: 4px solid transparent;
        background-clip: padding-box;
      }

      .text-input::placeholder {
        color: var(--placeholder);
      }

      .error-text {
        min-height: 0;
        margin-top: 12px;
        color: var(--error);
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
      }

      .paste-field-block {
        margin-bottom: 20px;
      }

      .error-text:empty {
        margin-top: 0;
      }

      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        /* margin-bottom: 16px; */
      }

      .info-box {
        height: 86px;
        padding: 10px 14px;
        border: 2px solid var(--border);
        border-radius: 8px;
        background: var(--field-readonly);
        box-shadow: 4px 4px 0 var(--shadow);
        overflow: hidden;
      }

      .info-title {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
      }

      .info-content {
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #detected-scales {
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        padding: 0;
        white-space: normal;
      }

      .check-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .global-controls {
        margin-top: 20px;
      }

      .global-checks {
        margin-bottom: 26px;
      }

      .check {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
        cursor: pointer;
      }

      .check span {
        display: inline-block;
        transform: translateY(1px);
      }

      input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        margin: 0;
        border: 2px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--shadow);
        position: relative;
        padding: 0;
        flex-shrink: 0;
      }

      input[type="checkbox"]::after {
        content: "";
        width: 14px;
        height: 14px;
        background-image: url("data:image/svg+xml,%3Csvg width='14' height='14' viewBox='0 0 14 14' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11.6673 3.5L5.25065 9.91667L2.33398 7' stroke='%23211F26' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E%0A");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        display: none;
      }

      input[type="checkbox"]:checked {
        background: var(--accent, var(--button));
      }

      input[type="checkbox"]:checked::after {
        display: block;
      }

      .primary {
        width: 512px;
        height: 48px;
        border: 2px solid var(--border);
        border-radius: 8px;
        box-shadow: 4px 4px 0 var(--shadow);
        background: var(--button);
        color: var(--text);
        font-size: 16px;
        font-weight: 500;
        line-height: 20px;
        letter-spacing: -0.1px;
        cursor: pointer;
      }

      .status {
        margin-top: 12px;
        min-height: 0;
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -0.2px;
      }

      .status:empty {
        display: none;
      }

      .status.success {
        color: #1d7f50;
      }

      .status.error {
        color: var(--error);
      }

      .loading-overlay {
        position: absolute;
        inset: 0;
        display: none;
        background: rgba(255, 255, 255, 0.76);
        z-index: 2000;
      }

      .loading-overlay.active {
        display: block;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }
    </style>

if (typeof figma !== "undefined") {
  figma.showUI(__html__, { width: 564, height: 100 });

  figma.ui.onmessage = async (message) => {
    if (!message || !message.type) {
      return;
    }

    if (message.type === "resize-ui") {
      const nextHeight = Number(message.height);
      if (nextHeight > 0) {
        figma.ui.resize(564, nextHeight);
      }
      return;
    }

    if (message.type === "ready") {
      await postInitData();
      return;
    }

    if (message.type === "save-prefs") {
      await savePrefs(message.prefs);
      return;
    }

    if (message.type === "inspect-css") {
      inspectCss(message.css || "");
      return;
    }

    try {
      if (message.type === "generate-from-css") {
        const result = await generateFromCss(message);
        postResult("success", result, "paste");
        return;
      }

      if (message.type === "generate-from-library") {
        const result = await generateFromLibrary(message);
        postResult("success", result, "library");
      }
    } catch (error) {
      const messageText =
        error instanceof Error ? error.message : "Something went wrong while generating variables.";
      postError(messageText, message.type === "generate-from-library" ? "library" : "paste");
    }
  };
}

async function postInitData() {
  const prefs = await loadPrefs();
  figma.ui.postMessage({
    type: "init",
    prefs,
    scales: LIBRARY_DISPLAY_ORDER.map((name) => {
      if (OVERLAY_SCALES.includes(name)) {
        return { name, category: "overlay", label: OVERLAY_LABELS[name] };
      }
      return {
        name,
        category: NEUTRAL_SCALES.includes(name) ? "neutral" : "accent"
      };
    })
  });
}

async function loadPrefs() {
  try {
    const stored = await figma.clientStorage.getAsync(PREFS_KEY);
    return stored && typeof stored === "object" ? stored : null;
  } catch (error) {
    // Preferences are a convenience, so a storage failure must not block the UI.
    return null;
  }
}

async function savePrefs(prefs) {
  if (!prefs || typeof prefs !== "object") {
    return;
  }
  try {
    await figma.clientStorage.setAsync(PREFS_KEY, prefs);
  } catch (error) {
    // Ignore: the plugin still works, it just forgets the last selection.
  }
}

function postResult(status, message, context) {
  figma.ui.postMessage({
    type: "result",
    status,
    message,
    context
  });
}

function postError(message, context) {
  figma.ui.postMessage({
    type: "error",
    message,
    context
  });
}

function inspectCss(css) {
  if (!css.trim()) {
    figma.ui.postMessage({
      type: "inspect",
      status: "empty",
      scales: [],
      modes: "—",
      note: "Paste Radix CSS to detect scales and modes automatically.",
      reason: "empty"
    });
    return;
  }

  try {
    const parsed = parseRadixCss(css);
    figma.ui.postMessage({
      type: "inspect",
      status: "ready",
      scales: collectDetectedScaleNames(parsed.tokens),
      modes: modeLabelFromSet(parsed.modes),
      note: "Detected from the pasted CSS.",
      reason: "ready"
    });
  } catch (error) {
    const messageText = error instanceof Error ? error.message : "Waiting for valid CSS.";
    const isNoRadix = messageText.indexOf("No Radix") !== -1;
    figma.ui.postMessage({
      type: "inspect",
      status: "invalid",
      scales: [],
      modes: "—",
      note: isNoRadix ? "No Radix scales detected yet." : messageText,
      reason: isNoRadix ? "no-radix" : "invalid-css"
    });
  }
}

async function generateFromCss(request) {
  const css = (request.css || "").trim();
  if (!css) {
    throw new Error("Paste some Radix CSS first.");
  }

  const parsed = parseRadixCss(css);
  const tokens = Array.from(parsed.tokens.values()).filter((token) =>
    request.includeAlphas ? true : !token.isAlpha
  );

  if (tokens.length === 0) {
    throw new Error(
      request.includeAlphas
        ? "No Radix color variables were found in the pasted CSS."
        : "Only alpha scales were found and \"Include alphas\" is off."
    );
  }

  return await createVariablesFromTokens({
    collectionName: request.collectionName,
    tokens,
    modes: parsed.modes,
    addToCanvas: Boolean(request.addToCanvas)
  });
}

async function generateFromLibrary(request) {
  const selection = buildTokensFromLibrarySelection(
    request.selectedScales || [],
    Boolean(request.includeAlphas),
    request.modePreference || "both"
  );

  return await createVariablesFromTokens({
    collectionName: request.collectionName,
    tokens: selection.tokens,
    modes: selection.modes,
    addToCanvas: Boolean(request.addToCanvas)
  });
}

async function createVariablesFromTokens(options) {
  const tokens = [...options.tokens].sort(compareTokens);
  if (tokens.length === 0) {
    throw new Error("No variables were generated from the current selection.");
  }

  validateTokensForCreation(tokens, options.modes);

  const collectionName = normalizeCollectionName(options.collectionName);

  // Reuse existing collection with same name to avoid duplicate folders
  const allCollections = await figma.variables.getLocalVariableCollectionsAsync();
  const existingCollection = allCollections.find(function (c) { return c.name === collectionName; }) || null;
  const collection = existingCollection || figma.variables.createVariableCollection(collectionName);

  const modeSetup = configureModes(collection, options.modes, !existingCollection);

  // Build lookup map so we don't create duplicate variables on re-runs
  const existingVarMap = new Map();
  for (const v of await figma.variables.getLocalVariablesAsync("COLOR")) {
    if (v.variableCollectionId === collection.id) {
      existingVarMap.set(v.name, v);
    }
  }

  const createdVariables = [];

  for (const token of tokens) {
    const variableName = `${token.canonicalScale}/${token.step}`;
    const variable = existingVarMap.get(variableName) || figma.variables.createVariable(variableName, collection, "COLOR");

    if (modeSetup.hasLight && modeSetup.hasDark) {
      const lightColor = token.modes.light !== undefined ? token.modes.light : token.modes.dark;
      const darkColor = token.modes.dark !== undefined ? token.modes.dark : token.modes.light;

      if (!lightColor || !darkColor) {
        throw new Error(`Missing values for ${variableName}.`);
      }

      variable.setValueForMode(modeSetup.lightModeId, lightColor);
      variable.setValueForMode(modeSetup.darkModeId, darkColor);
    } else {
      const targetMode = modeSetup.hasDark ? "dark" : "light";
      const modeId = modeSetup.hasDark ? modeSetup.darkModeId : modeSetup.lightModeId;
      const color =
        token.modes[targetMode] !== undefined
          ? token.modes[targetMode]
          : token.modes.light !== undefined
          ? token.modes.light
          : token.modes.dark;

      if (!modeId || !color) {
        throw new Error(`Missing value for ${variableName}.`);
      }
      variable.setValueForMode(modeId, color);
    }
    createdVariables.push(variable);
  }

  if (options.addToCanvas) {
    const previewFrames = createCanvasPreview(createdVariables, collectionName, collection, modeSetup);
    for (const previewFrame of previewFrames) {
      figma.currentPage.appendChild(previewFrame);
    }
    figma.currentPage.selection = previewFrames;
    figma.viewport.scrollAndZoomIntoView(previewFrames);
  }

  const plural = tokens.length === 1 ? "variable" : "variables";
  const canvasSuffix = options.addToCanvas ? " Canvas preview added." : "";
  return `Created ${tokens.length} ${plural} in "${collection.name}".${canvasSuffix}`;
}

function buildTokensFromLibrarySelection(selectedScales, includeAlphas, modePreference) {
  const uniqueScales = [...new Set(selectedScales)].filter(
    (scale) => RADIX_LIBRARY[scale] || OVERLAY_LIBRARY[scale]
  );
  if (uniqueScales.length === 0) {
    throw new Error("Select at least one Radix scale first.");
  }

  const tokens = [];
  const modes = getModeSetFromPreference(modePreference);

  for (const scale of uniqueScales.sort(compareBaseScales)) {
    if (OVERLAY_LIBRARY[scale]) {
      const overlayValues = OVERLAY_LIBRARY[scale];
      for (let index = 0; index < overlayValues.length; index += 1) {
        tokens.push({
          baseScale: scale,
          canonicalScale: scale,
          step: index + 1,
          isAlpha: true,
          modes: buildOverlayModeValues(overlayValues[index], modePreference)
        });
      }
      continue;
    }

    const data = RADIX_LIBRARY[scale];

    for (let index = 0; index < 12; index += 1) {
      const step = index + 1;
      tokens.push({
        baseScale: scale,
        canonicalScale: scale,
        step,
        isAlpha: false,
        modes: buildLibraryModeValues(data.light[index], data.dark[index], modePreference)
      });

      if (includeAlphas) {
        tokens.push({
          baseScale: scale,
          canonicalScale: `${scale}A`,
          step,
          isAlpha: true,
          modes: buildLibraryModeValues(data.lightAlpha[index], data.darkAlpha[index], modePreference)
        });
      }
    }
  }

  return { tokens, modes };
}

function buildLibraryModeValues(lightHex, darkHex, modePreference) {
  const values = {};
  if (modePreference !== "dark") {
    values.light = parseColor(lightHex);
  }
  if (modePreference !== "light") {
    values.dark = parseColor(darkHex);
  }
  return values;
}

function buildOverlayModeValues(colorString, modePreference) {
  const color = parseColor(colorString);
  const values = {};
  if (modePreference !== "dark") {
    values.light = color;
  }
  if (modePreference !== "light") {
    values.dark = color;
  }
  return values;
}

function getModeSetFromPreference(modePreference) {
  if (modePreference === "light") {
    return new Set(["light"]);
  }
  if (modePreference === "dark") {
    return new Set(["dark"]);
  }
  return new Set(["light", "dark"]);
}

function normalizeCollectionName(value) {
  return (value || "").trim() || "Color";
}

function configureModes(collection, detectedModes, isNewCollection) {
  const hasDark = detectedModes.has("dark");
  const hasLight = detectedModes.has("light") || !hasDark;

  // Find pre-existing named modes in reused collections to avoid duplicates.
  const lightMode = collection.modes.find(function (m) { return m.name === "Light"; });
  const darkMode = collection.modes.find(function (m) { return m.name === "Dark"; });
  const defaultModeId = collection.modes[0].modeId;

  function getOrCreateModeId(mode, name, canUseDefaultMode) {
    if (mode) {
      return mode.modeId;
    }

    if (canUseDefaultMode) {
      collection.renameMode(defaultModeId, name);
      return defaultModeId;
    }

    return collection.addMode(name);
  }

  if (hasLight && hasDark) {
    const lightModeId = getOrCreateModeId(lightMode, "Light", isNewCollection);
    const darkModeId = getOrCreateModeId(darkMode, "Dark", false);
    return {
      hasLight: true,
      hasDark: true,
      lightModeId,
      darkModeId
    };
  }

  if (hasDark) {
    const darkModeId = getOrCreateModeId(darkMode, "Dark", isNewCollection);
    return {
      hasLight: false,
      hasDark: true,
      darkModeId
    };
  }

  const lightModeId = getOrCreateModeId(lightMode, "Light", isNewCollection);
  return {
    hasLight: true,
    hasDark: false,
    lightModeId
  };
}

function createCanvasPreview(variables, collectionName, collection, modeSetup) {
  const modesToShow = [];
  if (modeSetup.hasLight) {
    modesToShow.push({ label: "Light", modeId: modeSetup.lightModeId });
  }
  if (modeSetup.hasDark) {
    modesToShow.push({ label: "Dark", modeId: modeSetup.darkModeId });
  }
  if (modesToShow.length === 0) {
    modesToShow.push({ label: "", modeId: null });
  }

  const GROUP_GAP = 48;
  const frames = [];
  let offsetX = 0;
  let maxHeight = 0;

  for (const mode of modesToShow) {
    const frame = buildPreviewFrame(variables, collectionName, mode.label);
    // Force this frame (and its swatches) to resolve the variables in this mode,
    // so the Dark theme is actually shown on canvas when selected.
    if (mode.modeId && typeof frame.setExplicitVariableModeForCollection === "function") {
      frame.setExplicitVariableModeForCollection(collection, mode.modeId);
    }
    frame.x = offsetX;
    frame.y = 0;
    frames.push(frame);
    offsetX += frame.width + GROUP_GAP;
    maxHeight = Math.max(maxHeight, frame.height);
  }

  const totalWidth = offsetX > 0 ? offsetX - GROUP_GAP : 0;
  const baseX = figma.viewport.center.x - totalWidth / 2;
  const baseY = figma.viewport.center.y - maxHeight / 2;
  for (const frame of frames) {
    frame.x += baseX;
    frame.y += baseY;
  }

  return frames;
}

function buildPreviewFrame(variables, collectionName, label) {
  const preview = figma.createFrame();
  preview.name = label ? `${collectionName} Preview – ${label}` : `${collectionName} Preview`;
  preview.fills = [];
  preview.clipsContent = false;

  const groups = new Map();

  for (const variable of variables) {
    const scaleName = variable.name.split("/")[0];
    const baseScaleName = scaleName.endsWith("A") ? scaleName.slice(0, -1) : scaleName;
    const existing = groups.get(baseScaleName) || { opaque: [], alpha: [] };
    if (scaleName.endsWith("A")) {
      existing.alpha.push(variable);
    } else {
      existing.opaque.push(variable);
    }
    groups.set(baseScaleName, existing);
  }

  let y = 0;
  let maxWidth = RECT_WIDTH;

  for (const scaleName of [...groups.keys()].sort(compareBaseScales)) {
    const group = groups.get(scaleName);
    group.opaque.sort(compareVariables);
    group.alpha.sort(compareVariables);

    const scaleFrame = figma.createFrame();
    scaleFrame.name = scaleName;
    scaleFrame.fills = [];
    scaleFrame.clipsContent = false;

    let localY = 0;
    let localWidth = RECT_WIDTH;

    if (group.opaque.length > 0) {
      const opaqueRow = createColorRow(group.opaque, scaleName, false);
      opaqueRow.x = 0;
      opaqueRow.y = localY;
      scaleFrame.appendChild(opaqueRow);
      localY += opaqueRow.height;
      localWidth = Math.max(localWidth, opaqueRow.width);
    }

    if (group.alpha.length > 0) {
      if (localY > 0) {
        localY += RECT_GAP;
      }

      const alphaRow = createColorRow(group.alpha, `${scaleName}A`, true);
      alphaRow.x = 0;
      alphaRow.y = localY;
      scaleFrame.appendChild(alphaRow);
      localY += alphaRow.height;
      localWidth = Math.max(localWidth, alphaRow.width);
    }

    scaleFrame.resize(localWidth, Math.max(localY, RECT_HEIGHT));
    scaleFrame.x = 0;
    scaleFrame.y = y;
    preview.appendChild(scaleFrame);

    maxWidth = Math.max(maxWidth, scaleFrame.width);
    y += scaleFrame.height + SECTION_GAP;
  }

  const previewHeight = groups.size > 0 ? y - SECTION_GAP : RECT_HEIGHT;
  preview.resize(maxWidth, previewHeight);

  return preview;
}

function compareVariables(left, right) {
  const leftStep = Number(left.name.split("/")[1]);
  const rightStep = Number(right.name.split("/")[1]);
  return leftStep - rightStep;
}

function createColorRow(variables, rowName, showCheckerboard) {
  const frame = figma.createFrame();
  frame.name = rowName;
  frame.fills = [];
  frame.clipsContent = false;

  for (let index = 0; index < variables.length; index += 1) {
    const variable = variables[index];
    const swatch = createSwatchNode(variable, showCheckerboard);
    swatch.x = index * (RECT_WIDTH + RECT_GAP);
    swatch.y = 0;
    frame.appendChild(swatch);
  }

  const width = variables.length * RECT_WIDTH + Math.max(0, variables.length - 1) * RECT_GAP;
  frame.resize(width, RECT_HEIGHT);
  return frame;
}

function createSwatchNode(variable, showCheckerboard) {
  if (!showCheckerboard) {
    const rect = figma.createRectangle();
    rect.name = variable.name;
    rect.resize(RECT_WIDTH, RECT_HEIGHT);
    rect.cornerRadius = CORNER_RADIUS;
    rect.cornerSmoothing = CORNER_SMOOTHING;
    rect.fills = [createBoundSolidPaint(variable)];
    return rect;
  }

  const frame = figma.createFrame();
  frame.name = variable.name;
  frame.resize(RECT_WIDTH, RECT_HEIGHT);
  frame.fills = [];
  frame.clipsContent = true;
  frame.cornerRadius = CORNER_RADIUS;
  frame.cornerSmoothing = CORNER_SMOOTHING;

  for (let row = 0; row < RECT_HEIGHT / CHECKER_SIZE; row += 1) {
    for (let column = 0; column < RECT_WIDTH / CHECKER_SIZE; column += 1) {
      const tile = figma.createRectangle();
      tile.resize(CHECKER_SIZE, CHECKER_SIZE);
      tile.x = column * CHECKER_SIZE;
      tile.y = row * CHECKER_SIZE;
      tile.fills = [
        {
          type: "SOLID",
          color: (row + column) % 2 === 0 ? CHECKER_LIGHT : CHECKER_DARK
        }
      ];
      frame.appendChild(tile);
    }
  }

  const overlay = figma.createRectangle();
  overlay.resize(RECT_WIDTH, RECT_HEIGHT);
  overlay.x = 0;
  overlay.y = 0;
  overlay.fills = [createBoundSolidPaint(variable)];
  frame.appendChild(overlay);

  return frame;
}

function createBoundSolidPaint(variable) {
  const paint = {
    type: "SOLID",
    color: { r: 0.5, g: 0.5, b: 0.5 },
    opacity: 1
  };

  if (figma.variables && typeof figma.variables.setBoundVariableForPaint === "function") {
    return figma.variables.setBoundVariableForPaint(paint, "color", variable);
  }

  paint.boundVariables = { color: variable.id };
  return paint;
}

function parseRadixCss(css) {
  const sanitized = css.replace(/\/\*[\s\S]*?\*\//g, "").trim();
  if (!sanitized) {
    throw new Error("Paste some Radix CSS first.");
  }

  const tokens = new Map();
  const modes = new Set();

  scanBlocks(sanitized, null, tokens, modes);

  if (tokens.size === 0) {
    throw new Error("No Radix color variables were found in the pasted CSS.");
  }

  return { tokens, modes };
}

function scanBlocks(css, inheritedMode, tokens, modes) {
  let cursor = 0;

  while (cursor < css.length) {
    const openIndex = css.indexOf("{", cursor);
    if (openIndex === -1) {
      break;
    }

    const rawSelector = css.slice(cursor, openIndex);
    const selector = rawSelector.slice(rawSelector.lastIndexOf(";") + 1).trim();
    const extracted = extractBlock(css, openIndex);
    const mode = detectMode(selector, inheritedMode);
    const directContent = stripNestedBlocks(extracted.body);

    collectVariables(directContent, mode, tokens, modes);

    if (extracted.body.includes("{")) {
      scanBlocks(extracted.body, mode, tokens, modes);
    }

    cursor = extracted.closeIndex + 1;
  }
}

function collectVariables(css, mode, tokens, modes) {
  const variablePattern = /--([A-Za-z0-9-]+)\s*:\s*([^;]+);/g;
  let match;

  while ((match = variablePattern.exec(css))) {
    const parsedName = parseRadixVariableName(match[1]);
    if (!parsedName) {
      continue;
    }

    const color = parseColor(match[2]);
    if (!color) {
      continue;
    }

    const key = `${parsedName.canonicalScale}/${parsedName.step}`;
    const existing = tokens.get(key);
    if (existing) {
      existing.modes[mode] = color;
    } else {
      tokens.set(key, {
        baseScale: parsedName.baseScale,
        canonicalScale: parsedName.canonicalScale,
        step: parsedName.step,
        isAlpha: parsedName.isAlpha,
        modes: { [mode]: color }
      });
    }

    modes.add(mode);
  }
}

function parseRadixVariableName(name) {
  const alphaCamel = name.match(/^([a-z0-9-]+)A-(\d{1,2})$/);
  if (alphaCamel) {
    const step = Number(alphaCamel[2]);
    if (step >= 1 && step <= 12) {
      return {
        baseScale: alphaCamel[1],
        canonicalScale: `${alphaCamel[1]}A`,
        step,
        isAlpha: true
      };
    }
  }

  const alphaDashed = name.match(/^([a-z0-9-]+)-a(\d{1,2})$/i);
  if (alphaDashed) {
    const step = Number(alphaDashed[2]);
    if (step >= 1 && step <= 12) {
      return {
        baseScale: alphaDashed[1],
        canonicalScale: `${alphaDashed[1]}A`,
        step,
        isAlpha: true
      };
    }
  }

  const opaque = name.match(/^([a-z0-9-]+)-(\d{1,2})$/);
  if (!opaque) {
    return null;
  }

  const step = Number(opaque[2]);
  if (step < 1 || step > 12) {
    return null;
  }

  return {
    baseScale: opaque[1],
    canonicalScale: opaque[1],
    step,
    isAlpha: false
  };
}

function detectMode(selector, inheritedMode) {
  const normalized = selector.toLowerCase();

  if (isDarkSelector(normalized)) {
    return "dark";
  }

  if (inheritedMode === "dark" && !isExplicitLightSelector(normalized)) {
    return "dark";
  }

  if (isExplicitLightSelector(normalized)) {
    return "light";
  }

  if (inheritedMode) {
    return inheritedMode;
  }

  return "light";
}

function isDarkSelector(selector) {
  return /(\.dark\b|\[data-theme\s*=\s*["']dark["']\]|\[data-color-mode\s*=\s*["']dark["']\]|prefers-color-scheme\s*:\s*dark)/i.test(
    selector
  );
}

function isExplicitLightSelector(selector) {
  return /(\.light\b|\[data-theme\s*=\s*["']light["']\]|\[data-color-mode\s*=\s*["']light["']\]|prefers-color-scheme\s*:\s*light)/i.test(
    selector
  );
}

function extractBlock(css, openIndex) {
  let depth = 0;

  for (let index = openIndex; index < css.length; index += 1) {
    if (css[index] === "{") {
      depth += 1;
    } else if (css[index] === "}") {
      depth -= 1;
      if (depth === 0) {
        return {
          body: css.slice(openIndex + 1, index),
          closeIndex: index
        };
      }
    }

  throw new Error("Invalid CSS: unmatched braces.");
}

function stripNestedBlocks(css) {
  let depth = 0;
  let output = "";

  for (let index = 0; index < css.length; index += 1) {
    const character = css[index];

    if (character === "{") {
      depth += 1;
      continue;
    }

    if (character === "}") {
      depth = Math.max(0, depth - 1);
      continue;
    }

    if (depth === 0) {
      output += character;
    }
  }

  return output;
}

function parseColor(input) {
  const value = input.trim().replace(/\s*!important\s*$/i, "");
  if (!value) {
    return null;
  }

  if (value.toLowerCase() === "transparent") {
    return { r: 0, g: 0, b: 0, a: 0 };
  }

  if (value.startsWith("#")) {
    return parseHexColor(value);
  }

  if (/^rgba?\(/i.test(value)) {
    return parseRgbColor(value);
  }

  if (/^hsla?\(/i.test(value)) {
    return parseHslColor(value);
  }

  if (/^oklch\(/i.test(value)) {
    return parseOklchColor(value);
  }

  if (/^oklab\(/i.test(value)) {
    return parseOklabColor(value);
  }

  if (/^color\(\s*display-p3\b/i.test(value)) {
    return parseDisplayP3Color(value);
  }

  return null;
}

function parseHexColor(value) {
  const hex = value.slice(1);

  if (hex.length === 3 || hex.length === 4) {
    const expanded = hex
      .split("")
      .map((character) => character + character)
      .join("");
    return parseHexColor(`#${expanded}`);
  }

  if (hex.length !== 6 && hex.length !== 8) {
    return null;
  }

  const r = Number.parseInt(hex.slice(0, 2), 16);
  const g = Number.parseInt(hex.slice(2, 4), 16);
  const b = Number.parseInt(hex.slice(4, 6), 16);
  const a = hex.length === 8 ? Number.parseInt(hex.slice(6, 8), 16) / 255 : 1;

  if ([r, g, b, a].some((part) => Number.isNaN(part))) {
    return null;
  }

  return {
    r: r / 255,
    g: g / 255,
    b: b / 255,
    a: clamp01(a)
  };
}

function parseRgbColor(value) {
  const inner = value.slice(value.indexOf("(") + 1, value.lastIndexOf(")")).trim();
  if (!inner) {
    return null;
  }

  let channels = [];
  let alphaText;

  if (inner.includes(",")) {
    const parts = inner.split(",").map((part) => part.trim());
    if (parts.length !== 3 && parts.length !== 4) {
      return null;
    }

    channels = parts.slice(0, 3);
    alphaText = parts[3];
  } else {
    const slashParts = inner.split("/");
    channels = slashParts[0].trim().split(/\s+/).filter(Boolean);
    alphaText = slashParts[1] ? slashParts[1].trim() : undefined;

    if (channels.length !== 3) {
      return null;
    }
  }

  const r = parseRgbChannel(channels[0]);
  const g = parseRgbChannel(channels[1]);
  const b = parseRgbChannel(channels[2]);
  const a = alphaText ? parseAlpha(alphaText) : 1;

  if ([r, g, b, a].some((part) => part === null)) {
    return null;
  }

  return {
    r: r / 255,
    g: g / 255,
    b: b / 255,
    a: clamp01(a)
  };
}

function parseRgbChannel(input) {
  const value = input.trim();

  if (value.endsWith("%")) {
    const percent = Number.parseFloat(value.slice(0, -1));
    if (Number.isNaN(percent)) {
      return null;
    }
    return clamp(percent, 0, 100) * 2.55;
  }

  const number = Number.parseFloat(value);
  if (Number.isNaN(number)) {
    return null;
  }

  return clamp(number, 0, 255);
}

function parseAlpha(input) {
  const value = input.trim();

  if (value.endsWith("%")) {
    const percent = Number.parseFloat(value.slice(0, -1));
    if (Number.isNaN(percent)) {
      return null;
    }
    return clamp(percent, 0, 100) / 100;
  }

  const number = Number.parseFloat(value);
  if (Number.isNaN(number)) {
    return null;
  }

  return clamp01(number);
}

function parseHslColor(value) {
  const inner = value.slice(value.indexOf("(") + 1, value.lastIndexOf(")")).trim();
  if (!inner) {
    return null;
  }

  let channels = [];
  let alphaText;

  if (inner.includes(",")) {
    const parts = inner.split(",").map((part) => part.trim());
    if (parts.length !== 3 && parts.length !== 4) {
      return null;
    }

    channels = parts.slice(0, 3);
    alphaText = parts[3];
  } else {
    const slashParts = inner.split("/");
    channels = slashParts[0].trim().split(/\s+/).filter(Boolean);
    alphaText = slashParts[1] ? slashParts[1].trim() : undefined;

    if (channels.length !== 3) {
      return null;
    }
  }

  const hue = Number.parseFloat(channels[0]);
  const saturation = parsePercent(channels[1]);
  const lightness = parsePercent(channels[2]);
  const alpha = alphaText ? parseAlpha(alphaText) : 1;

  if ([hue, saturation, lightness, alpha].some((part) => Number.isNaN(part) || part === null)) {
    return null;
  }

  const rgb = hslToRgb(hue, saturation, lightness);
  return {
    r: rgb.r,
    g: rgb.g,
    b: rgb.b,
    a: clamp01(alpha)
  };
}

function parseOklchColor(value) {
  const inner = value.slice(value.indexOf("(") + 1, value.lastIndexOf(")")).trim();
  if (!inner) return null;

  const slashParts = inner.split("/");
  const channels = slashParts[0].trim().split(/\s+/).filter(Boolean);
  const alphaText = slashParts[1] ? slashParts[1].trim() : undefined;

  if (channels.length !== 3) return null;

  const L = channels[0].endsWith("%") ? Number.parseFloat(channels[0]) / 100 : Number.parseFloat(channels[0]);
  const C = channels[1].endsWith("%") ? Number.parseFloat(channels[1]) / 100 * 0.4 : Number.parseFloat(channels[1]);
  const H = Number.parseFloat(channels[2]) * Math.PI / 180;
  const alpha = alphaText ? parseAlpha(alphaText) : 1;

  if ([L, C, H, alpha].some(function (v) { return Number.isNaN(v) || v === null; })) return null;

  const aLab = C * Math.cos(H);
  const bLab = C * Math.sin(H);

  return oklabToSrgb(L, aLab, bLab, alpha);
}

function parseOklabColor(value) {
  const inner = value.slice(value.indexOf("(") + 1, value.lastIndexOf(")")).trim();
  if (!inner) return null;

  const slashParts = inner.split("/");
  const channels = slashParts[0].trim().split(/\s+/).filter(Boolean);
  const alphaText = slashParts[1] ? slashParts[1].trim() : undefined;

  if (channels.length !== 3) return null;

  const L = channels[0].endsWith("%") ? Number.parseFloat(channels[0]) / 100 : Number.parseFloat(channels[0]);
  const aLab = channels[1].endsWith("%") ? Number.parseFloat(channels[1]) / 100 * 0.4 : Number.parseFloat(channels[1]);
  const bLab = channels[2].endsWith("%") ? Number.parseFloat(channels[2]) / 100 * 0.4 : Number.parseFloat(channels[2]);
  const alpha = alphaText ? parseAlpha(alphaText) : 1;

  if ([L, aLab, bLab, alpha].some(function (v) { return Number.isNaN(v) || v === null; })) return null;

  return oklabToSrgb(L, aLab, bLab, alpha);
}

function parseDisplayP3Color(value) {
  const inner = value.slice(value.indexOf("(") + 1, value.lastIndexOf(")")).trim();
  if (!inner) return null;

  const normalized = inner.replace(/\s+/g, " ").trim();
  if (!/^display-p3\b/i.test(normalized)) {
    return null;
  }

  const content = normalized.replace(/^display-p3\b/i, "").trim();
  if (!content) {
    return null;
  }

  const slashParts = content.split("/");
  const channels = slashParts[0].trim().split(/\s+/).filter(Boolean);
  const alphaText = slashParts[1] ? slashParts[1].trim() : undefined;

  if (channels.length !== 3) {
    return null;
  }

  const red = parseDisplayP3Channel(channels[0]);
  const green = parseDisplayP3Channel(channels[1]);
  const blue = parseDisplayP3Channel(channels[2]);
  const alpha = alphaText ? parseAlpha(alphaText) : 1;

  if ([red, green, blue, alpha].some(function (part) { return part === null || Number.isNaN(part); })) {
    return null;
  }

  return displayP3ToSrgb(red, green, blue, alpha);
}

function parseDisplayP3Channel(input) {
  const value = input.trim();

  if (value.endsWith("%")) {
    const percent = Number.parseFloat(value.slice(0, -1));
    if (Number.isNaN(percent)) {
      return null;
    }
    return clamp(percent, 0, 100) / 100;
  }

  const number = Number.parseFloat(value);
  if (Number.isNaN(number)) {
    return null;
  }

  return clamp01(number);
}

function oklabToSrgb(L, aLab, bLab, alpha) {
  const l_ = L + 0.3963377774 * aLab + 0.2158037573 * bLab;
  const m_ = L - 0.1055613458 * aLab - 0.0638541728 * bLab;
  const s_ = L - 0.0894841775 * aLab - 1.2914855480 * bLab;

  const l = l_ * l_ * l_;
  const m = m_ * m_ * m_;
  const s = s_ * s_ * s_;

  return {
    r: clamp01(linearToSrgb(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s)),
    g: clamp01(linearToSrgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s)),
    b: clamp01(linearToSrgb(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)),
    a: clamp01(alpha)
  };
}

function linearToSrgb(c) {
  if (c <= 0.0031308) return 12.92 * c;
  return 1.055 * Math.pow(Math.max(0, c), 1 / 2.4) - 0.055;
}

function srgbToLinear(c) {
  if (c <= 0.04045) return c / 12.92;
  return Math.pow((c + 0.055) / 1.055, 2.4);
}

function displayP3ToSrgb(red, green, blue, alpha) {
  const linearP3Red = srgbToLinear(red);
  const linearP3Green = srgbToLinear(green);
  const linearP3Blue = srgbToLinear(blue);

  const x =
    linearP3Red * 0.4865709486482162 +
    linearP3Green * 0.26566769316909306 +
    linearP3Blue * 0.1982172852343625;
  const y =
    linearP3Red * 0.2289745640697488 +
    linearP3Green * 0.6917385218365064 +
    linearP3Blue * 0.079286914093745;
  const z =
    linearP3Green * 0.04511338185890264 +
    linearP3Blue * 1.043944368900976;

  const linearSrgbRed = x * 3.2404542 + y * -1.5371385 + z * -0.4985314;
  const linearSrgbGreen = x * -0.969266 + y * 1.8760108 + z * 0.041556;
  const linearSrgbBlue = x * 0.0556434 + y * -0.2040259 + z * 1.0572252;

  return {
    r: clamp01(linearToSrgb(linearSrgbRed)),
    g: clamp01(linearToSrgb(linearSrgbGreen)),
    b: clamp01(linearToSrgb(linearSrgbBlue)),
    a: clamp01(alpha)
  };
}

function parsePercent(input) {
  const value = input.trim();
  if (!value.endsWith("%")) {
    return null;
  }

  const number = Number.parseFloat(value.slice(0, -1));
  if (Number.isNaN(number)) {
    return null;
  }

  return clamp(number, 0, 100) / 100;
}

function hslToRgb(hue, saturation, lightness) {
  const normalizedHue = ((hue % 360) + 360) % 360;
  const chroma = (1 - Math.abs(2 * lightness - 1)) * saturation;
  const hueSection = normalizedHue / 60;
  const x = chroma * (1 - Math.abs((hueSection % 2) - 1));

  let red = 0;
  let green = 0;
  let blue = 0;

  if (hueSection >= 0 && hueSection < 1) {
    red = chroma;
    green = x;
  } else if (hueSection >= 1 && hueSection < 2) {
    red = x;
    green = chroma;
  } else if (hueSection >= 2 && hueSection < 3) {
    green = chroma;
    blue = x;
  } else if (hueSection >= 3 && hueSection < 4) {
    green = x;
    blue = chroma;
  } else if (hueSection >= 4 && hueSection < 5) {
    red = x;
    blue = chroma;
  } else {
    red = chroma;
    blue = x;
  }

  const match = lightness - chroma / 2;
  return {
    r: clamp01(red + match),
    g: clamp01(green + match),
    b: clamp01(blue + match)
  };
}

function validateTokensForCreation(tokens, modes) {
  const hasDark = modes.has("dark");
  const hasLight = modes.has("light") || !hasDark;

  for (const token of tokens) {
    const variableName = `${token.canonicalScale}/${token.step}`;

    if (hasLight && hasDark) {
      const lightColor = token.modes.light !== undefined ? token.modes.light : token.modes.dark;
      const darkColor = token.modes.dark !== undefined ? token.modes.dark : token.modes.light;
      if (!lightColor || !darkColor) {
        throw new Error(`Missing values for ${variableName}.`);
      }
      continue;
    }

    const targetMode = hasDark ? "dark" : "light";
    const color =
      token.modes[targetMode] !== undefined
        ? token.modes[targetMode]
        : token.modes.light !== undefined
          ? token.modes.light
          : token.modes.dark;

    if (!color) {
      throw new Error(`Missing value for ${variableName}.`);
    }
  }
}

function collectDetectedScaleNames(tokenMap) {
  return [...new Set(Array.from(tokenMap.values()).map((token) => token.canonicalScale))].sort(compareScaleNames);
}

function modeLabelFromSet(modes) {
  const hasLight = modes.has("light");
  const hasDark = modes.has("dark");

  if (hasLight && hasDark) {
    return "Light, Dark";
  }
  if (hasDark) {
    return "Dark";
  }
  if (hasLight) {
    return "Light";
  }
  return "—";
}

function compareTokens(left, right) {
  const byBaseScale = compareBaseScales(left.baseScale, right.baseScale);
  if (byBaseScale !== 0) {
    return byBaseScale;
  }

  if (left.isAlpha !== right.isAlpha) {
    return left.isAlpha ? 1 : -1;
  }

  return left.step - right.step;
}

function compareScaleNames(left, right) {
  const leftParts = parseScaleName(left);
  const rightParts = parseScaleName(right);
  const byBaseScale = compareBaseScales(leftParts.base, rightParts.base);
  if (byBaseScale !== 0) {
    return byBaseScale;
  }
  if (leftParts.isAlpha !== rightParts.isAlpha) {
    return leftParts.isAlpha ? 1 : -1;
  }
  return left.localeCompare(right);
}

function parseScaleName(name) {
  const match = name.match(/^([a-z0-9-]+)(A)?$/);
  return {
    base: match ? match[1] : name,
    isAlpha: Boolean(match && match[2])

  const leftIndex = LIBRARY_DISPLAY_ORDER.indexOf(left);
  const rightIndex = LIBRARY_DISPLAY_ORDER.indexOf(right);

  if (leftIndex !== -1 && rightIndex !== -1) {
    return leftIndex - rightIndex;
  }
  if (leftIndex !== -1) {
    return -1;
  }
  if (rightIndex !== -1) {
    return 1;
  }
  return left.localeCompare(right);
}

function clamp(value, minimum, maximum) {
  return Math.min(maximum, Math.max(minimum, value));
}

function clamp01(value) {
  return clamp(value, 0, 1);
}

        tabPaste: document.getElementById("tab-paste"),
        panelLibrary: document.getElementById("panel-library"),
        panelPaste: document.getElementById("panel-paste"),
        modeFilters: document.getElementById("mode-filters"),
        neutralGrid: document.getElementById("neutral-grid"),
        accentGrid: document.getElementById("accent-grid"),
        overlayGrid: document.getElementById("overlay-grid"),
        librarySelectAll: document.getElementById("library-select-all"),
        libraryClearAll: document.getElementById("library-clear-all"),
        libraryCollectionName: document.getElementById("library-collection-name"),
        cssInput: document.getElementById("css-input"),
        pasteError: document.getElementById("paste-error"),
        pasteCollectionName: document.getElementById("paste-collection-name"),
        detectedScales: document.getElementById("detected-scales"),
        detectedModes: document.getElementById("detected-modes"),
        globalAddToCanvas: document.getElementById("global-add-to-canvas"),
        globalIncludeAlphas: document.getElementById("global-include-alphas"),
        generateButton: document.getElementById("generate-button"),
        status: document.getElementById("status"),
        loadingOverlay: document.getElementById("loading-overlay")
      };

      let inspectTimer = null;
      let shakeTimer = null;
      let resizeTimer = null;
      let lastHeight = 0;

      function setStatus(message, kind) {
        const hasMessage = Boolean(message);
        elements.status.textContent = message || "";
        elements.status.className = kind ? "status " + kind : "status";
        elements.shell.classList.toggle("has-status", hasMessage);
        scheduleResize();
      }

      function setBusy(isBusy) {
        state.busy = isBusy;
        elements.loadingOverlay.classList.toggle("active", isBusy);
        elements.loadingOverlay.setAttribute("aria-hidden", String(!isBusy));
      }

      function setActiveTab(tabName) {
        state.activeTab = tabName;
        elements.tabLibrary.classList.toggle("active", tabName === "library");
        elements.tabPaste.classList.toggle("active", tabName === "paste");
        elements.tabLibrary.setAttribute("aria-selected", String(tabName === "library"));
        elements.tabPaste.setAttribute("aria-selected", String(tabName === "paste"));
        elements.panelLibrary.classList.toggle("active", tabName === "library");
        elements.panelPaste.classList.toggle("active", tabName === "paste");
        setStatus("", "");
        persistPrefs();
        scheduleResize();
      }

      function renderModeFilters() {
        elements.modeFilters.innerHTML = modeOptions
          .map(function (option) {
            const isActive = state.library.selectedModes[option.value];
            return (
              '<button class="mode-chip' +
              (isActive ? " active" : "") +
              '" type="button" data-mode="' +
              escapeHtml(option.value) +
              '">' +
              escapeHtml(option.label) +
              "</button>"
            );
          })
          .join("");
      }

      function renderScaleGroup(target, category) {
        const scales = state.metadata.scales.filter(function (scale) {
          return scale.category === category;
        });

        target.innerHTML = scales
          .map(function (scale) {
            const isChecked = state.library.selectedScales.has(scale.name) ? "checked" : "";
            const dotColor = scaleDots[scale.name] || "#b3b3b3";
            return (
              '<label class="scale-option" style="--accent:' + escapeHtml(dotColor) + ';">' +
              '<input type="checkbox" data-scale="' +
              escapeHtml(scale.name) +
              '" ' +
              isChecked +
              " />" +
              '<span class="scale-name">' +
              escapeHtml(scale.label || capitalize(scale.name)) +
              "</span>" +
              "</label>"
            );
          })
          .join("");
      }

      function renderLibrary() {
        elements.libraryCollectionName.value = state.collectionName;
        renderModeFilters();
        renderScaleGroup(elements.neutralGrid, "neutral");
        renderScaleGroup(elements.accentGrid, "accent");
        renderScaleGroup(elements.overlayGrid, "overlay");
        renderGlobalControls();
        scheduleResize();
      }

      function renderGlobalControls() {
        elements.globalAddToCanvas.checked = state.settings.addToCanvas;
        elements.globalIncludeAlphas.checked = state.settings.includeAlphas;
      }

      function renderDetectedInfo() {
        elements.detectedScales.textContent = state.paste.detectedScales.length
          ? state.paste.detectedScales.join(", ")
          : "—";
        elements.detectedModes.textContent = state.paste.detectedModes || "—";
        scheduleResize();
      }

      function clearPasteError() {
        state.paste.errorMessage = "";
        state.paste.errorReason = "";
        elements.cssInput.classList.remove("error");
        elements.cssInput.classList.remove("shake");
        elements.pasteError.textContent = "";
        scheduleResize();
      }

      function showPasteError(message, shouldShake) {
        state.paste.errorMessage = message;
        elements.cssInput.classList.add("error");
        elements.pasteError.textContent = message;
        scheduleResize();

        if (!shouldShake) {
          return;
        }

        elements.cssInput.classList.remove("shake");
        window.clearTimeout(shakeTimer);
        void elements.cssInput.offsetWidth;
        elements.cssInput.classList.add("shake");
        shakeTimer = window.setTimeout(function () {
          elements.cssInput.classList.remove("shake");
        }, 700);
      }

      function scheduleInspect() {
        window.clearTimeout(inspectTimer);
        inspectTimer = window.setTimeout(function () {
          parent.postMessage(
            {
              pluginMessage: {
                type: "inspect-css",
                css: state.paste.css
              }
            },
            "*"
          );
        }, 220);
      }

      function scheduleResize() {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(function () {
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              const nextHeight = Math.ceil(elements.shell.getBoundingClientRect().height);
              if (nextHeight > 0 && lastHeight !== nextHeight) {
                lastHeight = nextHeight;
                parent.postMessage({ pluginMessage: { type: "resize-ui", height: nextHeight } }, "*");
              }
            });
          });
        }, 0);
      }

      let persistTimer = null;

      function persistPrefs() {
        window.clearTimeout(persistTimer);
        persistTimer = window.setTimeout(function () {
          parent.postMessage(
            {
              pluginMessage: {
                type: "save-prefs",
                prefs: {
                  activeTab: state.activeTab,
                  collectionName: state.collectionName,
                  selectedScales: getSelectedScaleArray(),
                  selectedModes: {
                    light: state.library.selectedModes.light,
                    dark: state.library.selectedModes.dark
                  },
                  settings: {
                    addToCanvas: state.settings.addToCanvas,
                    includeAlphas: state.settings.includeAlphas
                  }
                }
              }
            },
            "*"
          );
        }, 250);
      }

      function applyPrefs(prefs) {
        if (!prefs || typeof prefs !== "object") {
          return;
        }

        if (typeof prefs.collectionName === "string" && prefs.collectionName.trim()) {
          state.collectionName = prefs.collectionName;
          elements.pasteCollectionName.value = prefs.collectionName;
        }

        if (Array.isArray(prefs.selectedScales)) {
          const known = new Set(
            state.metadata.scales.map(function (scale) {
              return scale.name;
            })
          );
          state.library.selectedScales.clear();
          prefs.selectedScales.forEach(function (scale) {
            if (known.has(scale)) {
              state.library.selectedScales.add(scale);
            }
          });
        }

        if (prefs.selectedModes && typeof prefs.selectedModes === "object") {
          const light = Boolean(prefs.selectedModes.light);
          const dark = Boolean(prefs.selectedModes.dark);
          // Never restore a state where nothing is generated.
          if (light || dark) {
            state.library.selectedModes.light = light;
            state.library.selectedModes.dark = dark;
          }
        }

        if (prefs.settings && typeof prefs.settings === "object") {
          state.settings.addToCanvas = Boolean(prefs.settings.addToCanvas);
          state.settings.includeAlphas = Boolean(prefs.settings.includeAlphas);
        }

        if (prefs.activeTab === "paste" || prefs.activeTab === "library") {
          setActiveTab(prefs.activeTab);
        }
      }

      function getSelectedScaleArray() {
        return Array.from(state.library.selectedScales).sort();
      }

      function getModePreference() {
        const hasLight = state.library.selectedModes.light;
        const hasDark = state.library.selectedModes.dark;

        if (hasLight && hasDark) {
          return "both";
        }
        if (hasLight) {
          return "light";
        }
        if (hasDark) {
          return "dark";
        }
        return "";
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function capitalize(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      elements.tabLibrary.addEventListener("click", function () {
        setActiveTab("library");
      });

      elements.tabPaste.addEventListener("click", function () {
        setActiveTab("paste");
      });

      elements.modeFilters.addEventListener("click", function (event) {
        const button = event.target.closest("button[data-mode]");
        if (!button || state.busy) {
          return;
        }

        const mode = button.dataset.mode;
        state.library.selectedModes[mode] = !state.library.selectedModes[mode];
        renderModeFilters();
        persistPrefs();
      });

      elements.librarySelectAll.addEventListener("click", function () {
        if (state.busy) {
          return;
        }
        state.metadata.scales.forEach(function (scale) {
          state.library.selectedScales.add(scale.name);
        });
        renderLibrary();
        persistPrefs();
      });

      elements.libraryClearAll.addEventListener("click", function () {
        if (state.busy) {
          return;
        }
        state.library.selectedScales.clear();
        renderLibrary();
        persistPrefs();
      });

      [elements.neutralGrid, elements.accentGrid, elements.overlayGrid].forEach(function (grid) {
        grid.addEventListener("change", function (event) {
          const input = event.target.closest("input[data-scale]");
          if (!input) {
            return;
          }

          const scale = input.dataset.scale;
          if (input.checked) {
            state.library.selectedScales.add(scale);
          } else {
            state.library.selectedScales.delete(scale);
          }
          persistPrefs();
        });
      });

      function selectOnFocus(field) {
        let justFocused = false;
        field.addEventListener("focus", function () {
          justFocused = true;
          this.select();
        });
        // Chrome drops the selection on mouseup, but only swallow the first one
        // so a later click can still place the caret.
        field.addEventListener("mouseup", function (event) {
          if (justFocused) {
            event.preventDefault();
            justFocused = false;
          }
        });
        field.addEventListener("blur", function () {
          justFocused = false;
        });
      }
      selectOnFocus(elements.libraryCollectionName);
      selectOnFocus(elements.pasteCollectionName);

      elements.libraryCollectionName.addEventListener("input", function () {
        state.collectionName = elements.libraryCollectionName.value;
        elements.pasteCollectionName.value = elements.libraryCollectionName.value;
        persistPrefs();
      });

      elements.globalIncludeAlphas.addEventListener("change", function () {
        state.settings.includeAlphas = elements.globalIncludeAlphas.checked;
        persistPrefs();
      });

      elements.globalAddToCanvas.addEventListener("change", function () {
        state.settings.addToCanvas = elements.globalAddToCanvas.checked;
        persistPrefs();
      });

      function triggerPasteShakeOnly() {
        elements.cssInput.classList.remove("shake");
        window.clearTimeout(shakeTimer);
        void elements.cssInput.offsetWidth;
        elements.cssInput.classList.add("shake");
        shakeTimer = window.setTimeout(function () {
          elements.cssInput.classList.remove("shake");
        }, 700);
      }

      elements.generateButton.addEventListener("click", function () {
        if (state.busy) {
          return;
        }

        if (state.activeTab === "library") {
          if (state.library.selectedScales.size === 0) {
            setStatus("Select at least one Radix scale first.", "error");
            return;
          }

          const modePreference = getModePreference();
          if (!modePreference) {
            setStatus("Select Light or Dark first.", "error");
            return;
          }

          setBusy(true);
          parent.postMessage(
            {
              pluginMessage: {
                type: "generate-from-library",
                collectionName: state.collectionName,
                selectedScales: getSelectedScaleArray(),
                modePreference: modePreference,
                includeAlphas: state.settings.includeAlphas,
                addToCanvas: state.settings.addToCanvas
              }
            },
            "*"
          );
          return;
        }

        if (!state.paste.css.trim()) {
          triggerPasteShakeOnly();
          return;
        }

        if (state.paste.errorReason || state.paste.detectedScales.length === 0) {
          if (state.paste.errorReason === "no-radix" || state.paste.detectedScales.length === 0) {
            showPasteError(noRadixError, true);
          } else {
            triggerPasteShakeOnly();
          }
          return;
        }

        setBusy(true);
        parent.postMessage(
          {
            pluginMessage: {
              type: "generate-from-css",
              css: state.paste.css,
              collectionName: state.collectionName,
              addToCanvas: state.settings.addToCanvas,
              includeAlphas: state.settings.includeAlphas
            }
          },
          "*"
        );
      });

      elements.cssInput.addEventListener("input", function () {
        state.paste.css = elements.cssInput.value;
        clearPasteError();
        setStatus("", "");
        scheduleInspect();
      });

      elements.pasteCollectionName.addEventListener("input", function () {
        state.collectionName = elements.pasteCollectionName.value;
        elements.libraryCollectionName.value = elements.pasteCollectionName.value;
        persistPrefs();
      });



      window.onmessage = function (event) {
        const message = event.data && event.data.pluginMessage;
        if (!message) {
          return;
        }

        if (message.type === "init") {
          state.metadata.scales = message.scales || [];
          applyPrefs(message.prefs);
          renderLibrary();
          renderDetectedInfo();
          return;
        }

        if (message.type === "inspect") {
          const nextScales = message.scales || [];
          const nextModes = message.modes || "—";
          const nextScalesKey = nextScales.join("|");
          const currentScalesKey = state.paste.detectedScales.join("|");
          state.paste.note = message.note || defaultPasteNote;

          if (message.status === "ready") {
            if (nextScalesKey !== currentScalesKey) {
              state.paste.detectedScales = nextScales;
            }
            if (nextModes !== state.paste.detectedModes) {
              state.paste.detectedModes = nextModes;
            }
            clearPasteError();
            renderDetectedInfo();
            return;
          }

          if (message.status === "empty") {
            if (!state.paste.css.trim()) {
              state.paste.detectedScales = [];
              state.paste.detectedModes = "—";
              clearPasteError();
              renderDetectedInfo();
            }
            return;
          }

          if (message.status === "invalid") {
            state.paste.errorReason = message.reason || "";
            showPasteError(
              state.paste.errorReason === "no-radix" ? noRadixError : message.note || noRadixError,
              true
            );
            return;
          }
        }

        if (message.type === "result") {
          setBusy(false);
          setStatus(message.message, message.status === "success" ? "success" : "error");
          return;
        }

        if (message.type === "error") {
          setBusy(false);
          // Don't duplicate an error that's already shown under the CSS textarea
          if (message.context === "paste" && state.paste.errorMessage) {
            scheduleResize();
            return;
          }
          setStatus(message.message, "error");
          scheduleResize();
        }
      };

      renderModeFilters();
      renderDetectedInfo();
      renderGlobalControls();
      scheduleResize();

      parent.postMessage(
        {
          pluginMessage: {
            type: "ready"
          }
        },
        "*"
      );
    </script>
  </body>
</html>
